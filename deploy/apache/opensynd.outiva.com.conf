#
# Apache virtual host for the OpenSynd browser game (a static site).
# haproxy on another server terminates the public TLS for https://opensynd.outiva.com and forwards here, so this server
# only needs a self-signed certificate. Installed by deploy/setup-apache.sh, which fills in the @PLACEHOLDERS@.

<VirtualHost *:80>
    ServerName opensynd.outiva.com
    DocumentRoot @DOCROOT@/current
    ErrorLog @ERROR_LOG@
    CustomLog @ACCESS_LOG@ combined
    Include @COMMON@
</VirtualHost>

<VirtualHost *:443>
    ServerName opensynd.outiva.com
    DocumentRoot @DOCROOT@/current
    ErrorLog @ERROR_LOG@
    CustomLog @ACCESS_LOG@ combined

    SSLEngine on
    SSLCertificateFile @CERT@
    SSLCertificateKeyFile @KEY@

    Include @COMMON@
</VirtualHost>
