# SPDX-License-Identifier: GPL-2.0-or-later
#
# GitLab CI for the OpenSynd browser game: check it, build it, and publish it to https://opensynd.outiva.com.
#
# It expects the GitLab runner that lives on the web server, using the shell executor, with Node.js 20+ and Python 3
# installed there and write access to the site folder (deploy/setup-apache.sh sets that up). The game needs no
# `npm install` to build or to run its unit tests. The runner only takes jobs tagged `ubuntu-server`.
#
# Pushes to the default branch deploy by themselves; other branches can be deployed from the pipeline page with the
# manual "deploy" button.

default:
  tags:
    - ubuntu-server

stages:
  - check
  - build
  - deploy

variables:
  DOCROOT: /var/www/opensynd.outiva.com

check:
  stage: check
  script:
    - python3 tools/validate_content.py
    - python3 tools/check_web_sync.py
    - python3 tools/check_style.py
    - python3 tools/check_provenance.py
    - python3 tools/check_source_licenses.py
    - python3 tools/check_dependencies.py
    - python3 -m unittest discover -s tools -p "test_*.py"
    - cd web && npm test

# Hot updates: pages are pinned to their release once deploy/setup-apache.sh has been run again on the server (it adds the
# /r/<release>/ alias they load from): the build notices the alias in Apache's configuration, or the CI/CD variable HOT_UPDATES can
# be set to 1. Until then pages are not pinned and updates are simply announced.
build:
  stage: build
  script:
    # Pin releases (hot updates) when HOT_UPDATES is set, or when this server's Apache already has the /r/ alias.
    - |
      PIN="${HOT_UPDATES:-}"
      if [ -z "$PIN" ] && grep -rqs "Alias /r/" /etc/apache2 2>/dev/null; then PIN=1; fi
      echo "pinning releases: ${PIN:-no}"
      cd web && SOURCE_REVISION="$CI_COMMIT_SHORT_SHA" PIN_RELEASES="$PIN" node build.mjs
  artifacts:
    paths:
      - web/dist
    expire_in: 1 week

deploy:
  stage: deploy
  needs: [check, build]
  script:
    - sh deploy/deploy.sh web/dist "$CI_COMMIT_SHORT_SHA"
  environment:
    name: production
    url: https://opensynd.outiva.com
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true

# The files of a release: a reproducible archive, checksums and the bills of materials (docs/RELEASING.md). Run it by hand from a
# tagged commit; it does not deploy anything.
release:
  stage: deploy
  needs: [check, build]
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  script:
    - python3 tools/make_release.py --out release --allow-quarantined
  artifacts:
    paths:
      - release
    expire_in: never
