<script type="module">
  import * as THREE from "three";
  import { FBXLoader } from "three/addons/loaders/FBXLoader.js";

  const FRAME = 128;
  const SUPERSAMPLE = 2;
  const DIRECTIONS = 8;

  const loader = new FBXLoader();
  const load = (url) => loader.loadAsync(url);
  const textureLoader = new THREE.TextureLoader();

  // Rigid trench coat skirt, belt, collar, beret and boots, built in the bind pose
  // and attached to bones so they follow every animation.
  function addOutfit(root, look, rgb, bone) {
    root.updateMatrixWorld(true);
    const at = (name) => bone(name).getWorldPosition(new THREE.Vector3());
    const hips = at("Hips");
    const leftUp = at("LeftUpLeg");
    const rightUp = at("RightUpLeg");
    const hipWidth = leftUp.distanceTo(rightUp);
    const knee = at("LeftLeg");
    const ankle = at("LeftFoot");
    const toes = at("LeftToes");
    const head = at("Head");
    const headEnd = at("Head_end");
    const headHeight = head.distanceTo(headEnd);

    const coat = new THREE.MeshStandardMaterial({ color: rgb(look.coat), roughness: 0.9, side: THREE.DoubleSide });
    const coatDark = new THREE.MeshStandardMaterial({ color: rgb(look.coat).multiplyScalar(0.7), roughness: 0.9 });
    const boots = new THREE.MeshStandardMaterial({ color: rgb(look.boots), roughness: 0.6 });
    const beret = new THREE.MeshStandardMaterial({ color: rgb(look.beret), roughness: 1 });

    const place = (mesh, position, boneName) => {
      mesh.position.copy(position);
      root.add(mesh);
      root.updateMatrixWorld(true);
      bone(boneName).attach(mesh);
    };

    // Coat skirt: a flared open cone around each thigh, down past the knee.
    const skirtHeight = (hips.y - knee.y) * 1.25;
    for (const [side, upPosition] of [["Left", leftUp], ["Right", rightUp]]) {
      const cone = new THREE.Mesh(
        new THREE.CylinderGeometry(hipWidth * 0.62, hipWidth * 0.95, skirtHeight, 14, 1, true),
        coat,
      );
      place(cone, new THREE.Vector3(upPosition.x, hips.y - skirtHeight * 0.42, upPosition.z), `${side}UpLeg`);
    }
    const back = new THREE.Mesh(new THREE.BoxGeometry(hipWidth * 1.5, skirtHeight * 0.9, hipWidth * 0.12), coat);
    place(back, new THREE.Vector3(hips.x, hips.y - skirtHeight * 0.38, hips.z - hipWidth * 0.55), "Hips");

    // Belt and collar.
    const belt = new THREE.Mesh(new THREE.CylinderGeometry(hipWidth * 0.78, hipWidth * 0.78, hipWidth * 0.14, 16), coatDark);
    place(belt, new THREE.Vector3(hips.x, hips.y + hipWidth * 0.32, hips.z), "Spine");
    const neck = at("Neck");
    for (const side of [-1, 1]) {
      const collar = new THREE.Mesh(new THREE.BoxGeometry(hipWidth * 0.3, hipWidth * 0.34, hipWidth * 0.12), coat);
      collar.rotation.z = side * 0.35;
      place(collar, new THREE.Vector3(neck.x + side * hipWidth * 0.2, neck.y - hipWidth * 0.12, neck.z + hipWidth * 0.2), "Neck");
    }

    // Military boots: shin cylinder plus a toe box on each foot.
    const shinLength = (knee.y - ankle.y) * 0.62;
    for (const side of ["Left", "Right"]) {
      const footX = Math.abs(ankle.x) * (side === "Left" ? Math.sign(leftUp.x) : Math.sign(rightUp.x));
      const shin = new THREE.Mesh(new THREE.CylinderGeometry(hipWidth * 0.33, hipWidth * 0.38, shinLength, 12), boots);
      place(shin, new THREE.Vector3(footX, ankle.y + shinLength * 0.5 - hipWidth * 0.02, ankle.z), `${side}Leg`);
      const foot = new THREE.Mesh(
        new THREE.BoxGeometry(hipWidth * 0.66, hipWidth * 0.46, Math.abs(toes.z - ankle.z) + hipWidth * 0.8),
        boots,
      );
      place(foot, new THREE.Vector3(footX, ankle.y - hipWidth * 0.05, (toes.z + ankle.z) / 2 + hipWidth * 0.1), `${side}Foot`);
    }

    // Beret: a flattened dome tipped slightly to one side.
    const dome = new THREE.Mesh(new THREE.SphereGeometry(headHeight * 0.5, 20, 12), beret);
    dome.scale.set(1, 0.42, 1.05);
    dome.rotation.z = 0.18;
    place(dome, new THREE.Vector3(head.x + headHeight * 0.05, headEnd.y - headHeight * 0.12, head.z), "Head");

    return bone("Head");
  }

  window.renderSheet = async ({ model, skin, animations, look }) => {
    const size = FRAME * SUPERSAMPLE;
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(size, size);
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.add(new THREE.HemisphereLight(0xdfe9f2, 0x2a3138, 1.5));
    const key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(-2, 4, 3);
    scene.add(key);

    const texture = await textureLoader.loadAsync(skin);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.flipY = true;
    const root = await load(model);
    root.traverse((node) => {
      if (node.isMesh) {
        node.material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.8, metalness: 0 });
        node.frustumCulled = false;
      }
    });

    const rgb = (values) => new THREE.Color().setRGB(values[0] / 255, values[1] / 255, values[2] / 255, THREE.SRGBColorSpace);
    const bone = (name) => root.getObjectByName(name);
    let headBone = null;
    if (look) headBone = addOutfit(root, look, rgb, bone);

    const pivot = new THREE.Group();
    pivot.add(root);
    scene.add(pivot);
    const box = new THREE.Box3().setFromObject(root);
    const height = box.max.y - box.min.y;
    root.position.y -= box.min.y + height / 2;

    // Classic isometric framing: 35.264° elevation, looking at the figure's centre.
    const half = height * 0.62;
    const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, height * 20);
    const elevation = Math.atan(1 / Math.SQRT2);
    camera.position.set(0, Math.sin(elevation), Math.cos(elevation)).multiplyScalar(height * 6);
    camera.lookAt(0, 0, 0);

    const clips = {};
    for (const [name, { url }] of Object.entries(animations)) {
      // Each file also holds a one-frame "Targeting Pose" clip; use the real motion.
      const found = (await load(url)).animations;
      clips[name] = found.reduce((best, clip) => (clip.duration > best.duration ? clip : best));
    }
    const mixer = new THREE.AnimationMixer(root);

    const names = Object.keys(animations);
    const frameCounts = Object.fromEntries(names.map((name) => [name, animations[name].frames]));
    const maxFrames = Math.max(...Object.values(frameCounts));
    const atlas = document.createElement("canvas");
    atlas.width = FRAME * maxFrames;
    atlas.height = FRAME * DIRECTIONS * names.length;
    const atlasContext = atlas.getContext("2d");
    atlasContext.imageSmoothingQuality = "high";

    names.forEach((name, animationIndex) => {
      const clip = clips[name];
      const frames = frameCounts[name];
      mixer.stopAllAction();
      const action = mixer.clipAction(clip);
      action.play();
      for (let direction = 0; direction < DIRECTIONS; direction += 1) {
        pivot.rotation.y = (direction * Math.PI * 2) / DIRECTIONS;
        for (let frame = 0; frame < frames; frame += 1) {
          mixer.setTime((clip.duration * frame) / frames);
          // Animation scale tracks reset the head each frame; shrink it for adult proportions.
          if (headBone) headBone.scale.multiplyScalar(0.8);
          renderer.render(scene, camera);
          atlasContext.drawImage(
            renderer.domElement,
            frame * FRAME,
            (animationIndex * DIRECTIONS + direction) * FRAME,
            FRAME,
            FRAME,
          );
        }
      }
    });
    renderer.dispose();
    return {
      png: atlas.toDataURL("image/png"),
      meta: { frameSize: FRAME, directions: DIRECTIONS, animations: names.map((name, index) => ({ name, row: index * DIRECTIONS, frames: frameCounts[name], seconds: clips[name].duration })) },
    };
  };
  window.ready = true;
</script>
