<script type="importmap">
  { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
<script type="module">
  import * as THREE from "three";
  import { FBXLoader } from "three/addons/loaders/FBXLoader.js";

  const FRAME = 128;
  const SUPERSAMPLE = 2;
  const DIRECTIONS = 8;

  const loader = new FBXLoader();
  const rgb = (values) =>
    new THREE.Color().setRGB(values[0] / 255, values[1] / 255, values[2] / 255, THREE.SRGBColorSpace);

  // The human model samples a 32x32 palette: skin, boots, hair, jacket, trousers.
  function paletteTexture(colors) {
    const bands = [6, 5, 6, 6, 9];
    const canvas = document.createElement("canvas");
    canvas.width = 32;
    canvas.height = 32;
    const context = canvas.getContext("2d");
    let row = 0;
    colors.forEach((color, index) => {
      context.fillStyle = `rgb(${color.join(",")})`;
      context.fillRect(0, row, 32, bands[index]);
      row += bands[index];
    });
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.magFilter = THREE.NearestFilter;
    texture.minFilter = THREE.NearestFilter;
    return texture;
  }

  // Rigid military kit attached to bones in the bind pose, so it follows every
  // animation: beret, chest rig with pouches, belt, shoulder boards and boots.
  function addUniformKit(root, scene, kit, mixer, idleClip) {
    // Measure in the first idle frame: upright and symmetric, unlike the pose the file loads in.
    mixer.clipAction(idleClip).play();
    mixer.setTime(0);
    root.updateMatrixWorld(true);
    const bone = (name) => root.getObjectByName(name);
    const at = (name) => bone(name).getWorldPosition(new THREE.Vector3());
    const hips = at("Hips");
    const chest = at("Spine2");
    const neck = at("Neck");
    const head = at("Head");
    const headTop = at("HeadTop_End");
    const leftUp = at("LeftUpLeg");
    const rightUp = at("RightUpLeg");
    const unit = leftUp.distanceTo(rightUp);
    const headHeight = head.distanceTo(headTop);

    // Body frame: right toward the character's left leg, forward = right x up.
    const right = leftUp.clone().sub(rightUp).setY(0).normalize();
    const up = new THREE.Vector3(0, 1, 0);
    const forward = new THREE.Vector3().crossVectors(right, up);
    const orientation = new THREE.Quaternion().setFromRotationMatrix(
      new THREE.Matrix4().makeBasis(right, up, forward),
    );
    const offset = (base, x, y, z) =>
      base.clone().addScaledVector(right, x).addScaledVector(up, y).addScaledVector(forward, z);

    const material = (color, roughness = 0.85) =>
      new THREE.MeshStandardMaterial({ color: rgb(color), roughness });
    const rig = material(kit.rig);
    const boots = material(kit.boots, 0.55);
    const beret = material(kit.beret, 1);
    const glow = (color) => new THREE.MeshBasicMaterial({ color: rgb(color) });

    const place = (mesh, position, boneName) => {
      mesh.position.copy(position);
      mesh.quaternion.copy(orientation);
      // Positions are world coordinates, so parent to the (identity) scene first.
      scene.add(mesh);
      mesh.updateMatrixWorld(true);
      bone(boneName).attach(mesh);
    };
    const box = (w, h, d, mat) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);

    // Trench coat: a flared skirt around each thigh, a back panel and neon hem piping.
    const coat = new THREE.MeshStandardMaterial({ color: rgb(kit.coat), roughness: 0.9, side: THREE.DoubleSide });
    const kneeY = at("LeftLeg").y;
    const skirt = (hips.y - kneeY) * 1.75;
    for (const [side, up] of [["Left", leftUp], ["Right", rightUp]]) {
      const top = unit * 0.66;
      const bottom = unit * 1.0;
      const centre = new THREE.Vector3(up.x, hips.y - skirt * 0.4, up.z);
      place(new THREE.Mesh(new THREE.CylinderGeometry(top, bottom, skirt, 16, 1, true), coat), centre, `${side}UpLeg`);
      const hem = new THREE.Mesh(new THREE.CylinderGeometry(bottom, bottom, unit * 0.05, 16, 1, true), glow(kit.glow));
      place(hem, new THREE.Vector3(up.x, hips.y - skirt * 0.4 - skirt / 2, up.z), `${side}UpLeg`);
    }
    place(box(unit * 1.6, skirt * 0.95, unit * 0.1, coat), offset(hips, 0, -skirt * 0.36, -unit * 0.6), "Hips");
    // Belt, glowing chest trim and shoulder boards.
    place(box(unit * 1.75, unit * 0.2, unit * 1.0, material(kit.belt)), offset(hips, 0, unit * 0.15, 0), "Hips");
    place(box(unit * 1.5, unit * 0.06, unit * 0.06, glow(kit.glow)), offset(chest, 0, unit * 0.38, unit * 0.62), "Spine2");
    for (const side of [-1, 1]) {
      place(box(unit * 0.55, unit * 0.1, unit * 0.45, rig), offset(neck, side * unit * 0.95, -unit * 0.1, 0), "Spine2");
      const edge = box(unit * 0.55, unit * 0.04, unit * 0.05, glow(kit.glow));
      place(edge, offset(neck, side * unit * 0.95, -unit * 0.03, unit * 0.2), "Spine2");
      // Popped collar flaps with a neon edge.
      const flap = box(unit * 0.35, unit * 0.55, unit * 0.08, coat);
      flap.rotateZ(side * 0.3);
      place(flap, offset(neck, side * unit * 0.32, unit * 0.12, unit * 0.12), "Neck");
      place(box(unit * 0.04, unit * 0.5, unit * 0.09, glow(kit.glow)), offset(neck, side * unit * 0.46, unit * 0.14, unit * 0.12), "Neck");
    }
    // Coat sleeves over both arms and gloves over the hands, so no bare skin shows.
    const limb = (from, to, radiusFrom, radiusTo, mat, boneName, start = 0, end = 1) => {
      const a = at(from).lerp(at(to), start);
      const b = at(from).lerp(at(to), end);
      const direction = b.clone().sub(a);
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radiusTo, radiusFrom, direction.length() * 1.06, 10), mat);
      mesh.position.copy(a.clone().lerp(b, 0.5));
      mesh.quaternion.setFromUnitVectors(up, direction.normalize());
      scene.add(mesh);
      mesh.updateMatrixWorld(true);
      bone(boneName).attach(mesh);
    };
    const glove = material(kit.boots, 0.5);
    const metal = new THREE.MeshStandardMaterial({ color: rgb(kit.metal), roughness: 0.3, metalness: 0.9 });
    for (const side of ["Left", "Right"]) {
      limb(`${side}Shoulder`, `${side}Arm`, unit * 0.46, unit * 0.43, coat, `${side}Shoulder`, -0.2, 1.1);
      limb(`${side}Arm`, `${side}ForeArm`, unit * 0.43, unit * 0.34, coat, `${side}Arm`, -0.3, 1.04);
      limb(`${side}ForeArm`, `${side}Hand`, unit * 0.33, unit * 0.27, coat, `${side}ForeArm`, -0.04, 1.08);
      const hand = new THREE.Mesh(new THREE.SphereGeometry(unit * 0.33, 10, 8), glove);
      place(hand, at(`${side}Hand`).add(new THREE.Vector3(0, -unit * 0.03, 0)), `${side}Hand`);
    }
    // Cybernetic left forearm gauntlet: brushed metal over the sleeve with a glowing band.
    limb("LeftForeArm", "LeftHand", unit * 0.35, unit * 0.29, metal, "LeftForeArm", 0.4, 0.98);
    limb("LeftForeArm", "LeftHand", unit * 0.37, unit * 0.37, glow(kit.glow), "LeftForeArm", 0.55, 0.6);
    // Boots: each side from its own bones.
    for (const side of ["Left", "Right"]) {
      const knee = at(`${side}Leg`);
      const ankle = at(`${side}Foot`);
      const toes = at(`${side}ToeBase`);
      const shin = knee.distanceTo(ankle) * 0.75;
      const cylinder = new THREE.Mesh(new THREE.CylinderGeometry(unit * 0.34, unit * 0.4, shin, 12), boots);
      place(cylinder, ankle.clone().add(new THREE.Vector3(0, shin * 0.5 - unit * 0.12, 0)), `${side}Leg`);
      const toeLength = ankle.distanceTo(toes) + unit * 0.5;
      const foot = box(unit * 0.8, unit * 0.62, toeLength * 1.5, boots);
      place(foot, offset(ankle, 0, -unit * 0.3, toeLength * 0.34), `${side}Foot`);
    }
    // Beret and a glowing visor band across the eyes.
    const dome = new THREE.Mesh(new THREE.SphereGeometry(headHeight * 0.62, 20, 12), beret);
    dome.scale.set(1, 0.42, 1.08);
    dome.rotation.z = 0.15;
    place(dome, offset(headTop, 0, -headHeight * 0.1, 0), "Head");
    const eyeLevel = head.clone().lerp(headTop, 0.45);
    place(box(headHeight * 0.95, headHeight * 0.14, headHeight * 0.2, glow(kit.glow)), offset(eyeLevel, 0, 0, headHeight * 0.4), "Head");
  }

  // Turn a bone so that the line from it to its child points along `direction` (world space),
  // keeping its twist. Used to place the arms.
  function aimBone(bone, child, direction) {
    bone.updateWorldMatrix(true, true);
    const from = bone.getWorldPosition(new THREE.Vector3());
    const current = child.getWorldPosition(new THREE.Vector3()).sub(from).normalize();
    const delta = new THREE.Quaternion().setFromUnitVectors(current, direction.clone().normalize());
    const world = bone.getWorldQuaternion(new THREE.Quaternion());
    const parent = bone.parent.getWorldQuaternion(new THREE.Quaternion());
    bone.quaternion.copy(parent.invert().multiply(delta.multiply(world)));
    bone.updateWorldMatrix(true, true);
  }

  // A weapon held in both hands. It is attached to the chest so it follows the torso, and every
  // frame both arms are solved onto its grips (a two-bone solve with the elbows down and out).
  // `pose()` must run after the animation for the frame has been applied.
  function addAimedWeapon(root, scene, type, mixer, idleClip) {
    mixer.clipAction(idleClip).play();
    mixer.setTime(0);
    root.updateMatrixWorld(true);
    const bone = (name) => root.getObjectByName(name);
    const at = (name) => bone(name).getWorldPosition(new THREE.Vector3());
    const chestBone = bone("Spine2");
    const chest = at("Spine2");
    const unit = at("LeftUpLeg").distanceTo(at("RightUpLeg"));
    const axes = () => {
      const right = at("LeftUpLeg").sub(at("RightUpLeg")).setY(0).normalize();
      const up = new THREE.Vector3(0, 1, 0);
      return { right, up, forward: new THREE.Vector3().crossVectors(right, up) };
    };
    const idle = axes();
    const orientation = new THREE.Quaternion().setFromRotationMatrix(
      new THREE.Matrix4().makeBasis(idle.right, idle.up, idle.forward),
    );
    // x is toward the character's left, y up, z forward, all in hip-widths from the chest.
    const spot = (x, y, z) =>
      chest.clone()
        .addScaledVector(idle.right, x * unit)
        .addScaledVector(idle.up, y * unit)
        .addScaledVector(idle.forward, z * unit);
    const steel = new THREE.MeshStandardMaterial({ color: rgb([176, 188, 204]), roughness: 0.35, metalness: 0.55 });
    const dark = new THREE.MeshStandardMaterial({ color: rgb([34, 38, 48]), roughness: 0.6, metalness: 0.3 });
    const trim = new THREE.MeshStandardMaterial({ color: rgb([245, 195, 90]), roughness: 0.4, metalness: 0.3 });
    const glow = new THREE.MeshBasicMaterial({ color: rgb([120, 245, 240]) });
    const slide = new THREE.MeshStandardMaterial({ color: rgb([205, 214, 228]), roughness: 0.3, metalness: 0.55 });
    const heavy = type === "heavy-pulse";
    const K = heavy ? 1.15 : 2.3; // size of the weapon relative to the drawings below
    const origin = heavy ? { x: -0.3, y: -0.62, z: 0.5 } : { x: -0.1, y: -0.5, z: 0.45 };
    // `tilt` leans a part about its sideways axis (positive: the top leans forward), for pistol grips.
    const part = (w, h, d, material, x, y, z, tilt = 0) => {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(unit * w * K, unit * h * K, unit * d * K), material);
      mesh.position.copy(spot(origin.x + x * K, origin.y + y * K, origin.z + z * K));
      mesh.quaternion.copy(orientation);
      if (tilt !== 0) mesh.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), tilt));
      scene.add(mesh);
      mesh.updateMatrixWorld(true);
      chestBone.attach(mesh);
    };
    let leftGrip;
    if (heavy) {
      part(0.3, 0.34, 1.0, steel, 0, 0.1, 0.55); // receiver
      part(0.24, 0.24, 1.1, dark, 0, 0.1, 1.55); // barrel shroud
      part(0.12, 0.12, 0.45, steel, 0, 0.1, 2.3); // barrel
      part(0.4, 0.4, 0.14, glow, 0, 0.1, 2.55); // emitter
      part(0.24, 0.4, 0.7, dark, 0, 0.05, -0.4); // stock
      part(0.22, 0.55, 0.24, dark, 0, -0.22, 0.12); // grip
      part(0.24, 0.5, 0.34, trim, 0, -0.28, 0.85); // battery pack
      part(0.16, 0.28, 0.18, dark, 0, -0.2, 1.5); // foregrip
      part(0.18, 0.18, 0.65, dark, 0, 0.4, 0.75); // scope
      part(0.2, 0.2, 0.08, glow, 0, 0.4, 1.12); // scope lens
      part(0.1, 0.06, 0.8, trim, 0, 0.3, 0.55); // top rail
      leftGrip = spot(origin.x, origin.y - 0.2 * K, origin.z + 1.5 * K);
    } else {
      // A semi-automatic pistol: slim slide, frame, tilted grip, trigger guard, sights, magazine base.
      part(0.15, 0.2, 0.88, slide, 0, 0.16, 0.5); // slide
      part(0.15, 0.1, 0.62, dark, 0, 0.02, 0.4); // frame under the slide
      part(0.09, 0.09, 0.14, dark, 0, 0.17, 1.0); // barrel tip
      part(0.12, 0.12, 0.04, glow, 0, 0.17, 1.1); // muzzle ring
      part(0.17, 0.62, 0.24, dark, 0, -0.3, 0.08, 0.28); // grip, leaning back
      part(0.19, 0.06, 0.28, steel, 0, -0.6, -0.02, 0.28); // magazine base
      part(0.05, 0.22, 0.06, dark, 0, -0.1, 0.56); // trigger guard (front)
      part(0.05, 0.06, 0.36, dark, 0, -0.2, 0.4); // trigger guard (bottom)
      part(0.04, 0.12, 0.05, dark, 0, -0.08, 0.38); // trigger
      part(0.07, 0.07, 0.08, steel, 0, 0.3, 0.08); // rear sight
      part(0.05, 0.07, 0.06, steel, 0, 0.3, 0.86); // front sight
      leftGrip = spot(origin.x + 0.18 * K, origin.y - 0.22 * K, origin.z + 0.02 * K);
    }
    const rightGrip = spot(origin.x, origin.y, origin.z);
    const grips = { Right: chestBone.worldToLocal(rightGrip.clone()), Left: chestBone.worldToLocal(leftGrip.clone()) };

    const solve = (side, pole, restPose) => {
      const upper = bone(`${side}Arm`);
      const fore = bone(`${side}ForeArm`);
      const hand = bone(`${side}Hand`);
      upper.updateWorldMatrix(true, true);
      const shoulder = upper.getWorldPosition(new THREE.Vector3());
      const elbow = fore.getWorldPosition(new THREE.Vector3());
      const wrist = hand.getWorldPosition(new THREE.Vector3());
      const length1 = shoulder.distanceTo(elbow);
      const length2 = elbow.distanceTo(wrist);
      const target = chestBone.localToWorld(grips[side].clone());
      const toTarget = target.clone().sub(shoulder);
      const distance = Math.min(Math.max(toTarget.length(), 0.05), length1 + length2 - 0.001);
      const direction = toTarget.normalize();
      const along = (length1 * length1 - length2 * length2 + distance * distance) / (2 * distance);
      const lift = Math.sqrt(Math.max(length1 * length1 - along * along, 0));
      const side_ = pole.clone().sub(direction.clone().multiplyScalar(pole.dot(direction))).normalize();
      const bend = shoulder.clone().addScaledVector(direction, along).addScaledVector(side_, lift);
      aimBone(upper, fore, bend.clone().sub(shoulder));
      const elbowNow = fore.getWorldPosition(new THREE.Vector3());
      aimBone(fore, hand, shoulder.clone().addScaledVector(direction, distance).sub(elbowNow));
      if (restPose[hand.name]) hand.quaternion.copy(restPose[hand.name]);
    };
    return {
      pose(restPose) {
        root.updateMatrixWorld(true);
        const { right, up } = axes();
        // Elbows hang down and a little outward from each side.
        solve("Right", up.clone().multiplyScalar(-1).addScaledVector(right, -0.4), restPose);
        solve("Left", up.clone().multiplyScalar(-1).addScaledVector(right, 0.4), restPose);
      },
    };
  }

  window.renderSheet = async ({ model, animations, palette, kit, aim }) => {
    const size = FRAME * SUPERSAMPLE;
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(size, size);
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.add(new THREE.HemisphereLight(0xdfe9f2, 0x2a3138, 1.5));
    const key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(-2, 4, 3);
    scene.add(key);

    const root = await loader.loadAsync(model);
    const texture = paletteTexture(palette);
    root.traverse((node) => {
      if (node.isMesh) {
        node.material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.85 });
        node.frustumCulled = false;
      }
    });

    const pivot = new THREE.Group();
    pivot.add(root);
    scene.add(pivot);
    root.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(root);
    const height = box.max.y - box.min.y;
    root.position.y -= box.min.y + height / 2;

    // Classic isometric framing: 35.264° elevation, looking at the figure's centre.
    const half = height * 0.62;
    const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, height * 20);
    const elevation = Math.atan(1 / Math.SQRT2);
    camera.position.set(0, Math.sin(elevation), Math.cos(elevation)).multiplyScalar(height * 6);
    camera.lookAt(0, 0, 0);

    const names = Object.keys(animations);
    const clips = {};
    for (const name of names) {
      const found = (await loader.loadAsync(model)).animations;
      const wanted = animations[name].pick;
      clips[name] = found.find((clip) => clip.name.includes(wanted));
      if (!clips[name]) throw new Error(`No animation matching ${wanted}`);
    }
    const mixer = new THREE.AnimationMixer(root);
    if (kit) addUniformKit(root, scene, kit, mixer, clips.idle);
    // An armed variant holds its weapon in both hands: the weapon is built after the kit so it
    // is measured in the same idle pose, and the arms are solved onto it every frame.
    const aimed = aim ? addAimedWeapon(root, scene, aim, mixer, clips.idle) : null;
    // The idle pose (arms down, head level) is the reference for a stiffer, more serious gait.
    const restPose = {};
    root.traverse((node) => {
      if (node.isBone) restPose[node.name] = node.quaternion.clone();
    });

    const frameCounts = Object.fromEntries(names.map((name) => [name, animations[name].frames]));
    const maxFrames = Math.max(...Object.values(frameCounts));
    const atlas = document.createElement("canvas");
    atlas.width = FRAME * maxFrames;
    atlas.height = FRAME * DIRECTIONS * names.length;
    const atlasContext = atlas.getContext("2d");
    atlasContext.imageSmoothingQuality = "high";

    names.forEach((name, animationIndex) => {
      const clip = clips[name];
      const frames = frameCounts[name];
      // Long idle loops are sampled over a short window so the sheet stays small.
      const seconds = Math.min(clip.duration, animations[name].window ?? clip.duration);
      mixer.stopAllAction();
      mixer.clipAction(clip).play();
      for (let direction = 0; direction < DIRECTIONS; direction += 1) {
        pivot.rotation.y = (direction * Math.PI * 2) / DIRECTIONS;
        for (let frame = 0; frame < frames; frame += 1) {
          mixer.setTime((seconds * frame) / frames);
          // Blend selected bones toward the rest pose: 0 keeps the clip, 1 freezes the bone.
          for (const [boneName, amount] of Object.entries(animations[name].posture ?? {})) {
            const bone = root.getObjectByName(boneName);
            if (bone && restPose[boneName]) bone.quaternion.slerp(restPose[boneName], amount);
          }
          aimed?.pose(restPose);
          renderer.render(scene, camera);
          atlasContext.drawImage(
            renderer.domElement,
            frame * FRAME,
            (animationIndex * DIRECTIONS + direction) * FRAME,
            FRAME,
            FRAME,
          );
        }
      }
    });
    renderer.dispose();
    return {
      png: atlas.toDataURL("image/png"),
      meta: {
        frameSize: FRAME,
        directions: DIRECTIONS,
        animations: names.map((name, index) => ({
          name,
          row: index * DIRECTIONS,
          frames: frameCounts[name],
          // Playback length in the game; a shorter value than the clip gives a brisker stride.
          seconds: animations[name].playback ?? Math.min(clips[name].duration, animations[name].window ?? clips[name].duration),
        })),
      },
    };
  };
  window.ready = true;
</script>
