#
# Settings shared by the HTTP and HTTPS virtual hosts of opensynd.outiva.com (a static site served from the "current"
# release directory, which the GitLab job switches with a symbolic link).

<Directory "@DOCROOT@">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

DirectoryIndex index.html

# The game is made of ES modules, JSON and audio.
AddType text/javascript .js .mjs
AddType application/json .json
AddType audio/mpeg .mp3
AddType image/svg+xml .svg

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css text/javascript application/json image/svg+xml text/plain
</IfModule>

<IfModule mod_headers.c>
    # Behind haproxy: tell browsers this is a normal page; keep a few safe defaults.
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    # Every deploy changes the files, so make browsers check for a new copy; the big assets can be cached a while.
    <FilesMatch "\.(html|js|mjs|json|css)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <FilesMatch "\.(png|mp3|svg)$">
        Header set Cache-Control "public, max-age=86400"
    </FilesMatch>
</IfModule>
