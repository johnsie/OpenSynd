#
# Apache virtual host for the OpenSynd browser game (a static site).
# Public TLS for https://opensynd.outiva.com terminates at haproxy on another server, which talks to this vhost over TLS
# (SNI opensynd.outiva.com, without verification), so the certificate below is a self-signed origin certificate. Do not
# name this file 000-*: the first :443 vhost is the default for every unmatched hostname on this shared server. Installed by deploy/setup-apache.sh, which fills in the @PLACEHOLDERS@.

<VirtualHost *:80>
    ServerName opensynd.outiva.com
    Redirect permanent / https://opensynd.outiva.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName opensynd.outiva.com
    DocumentRoot @DOCROOT@/current
    ErrorLog @ERROR_LOG@
    CustomLog @ACCESS_LOG@ combined

    SSLEngine on
    SSLCertificateFile @CERT@
    SSLCertificateKeyFile @KEY@

    Include @COMMON@
</VirtualHost>
