#
# Settings shared by the HTTP and HTTPS virtual hosts of opensynd.outiva.com (a static site served from the "current"
# release directory, which the GitLab job switches with a symbolic link).

<Directory "@DOCROOT@">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

DirectoryIndex index.html

# Hot updates: every release stays reachable under /r/<name>/. A game that is already running keeps loading its code, content and
# art from its own release, so deploying a newer one never changes anything under a player; the page notices the newer release
# and switches over at a quiet moment. A release never changes once published, so browsers may keep its files for good.
Alias /r/ "@DOCROOT@/releases/"
<Directory "@DOCROOT@/releases">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
<IfModule mod_headers.c>
    <LocationMatch "^/r/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
</IfModule>

# The game is made of ES modules, JSON and audio.
AddType text/javascript .js .mjs
AddType application/json .json
AddType audio/mpeg .mp3
AddType image/svg+xml .svg

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css text/javascript application/json image/svg+xml text/plain
</IfModule>

<IfModule mod_headers.c>
    # Behind haproxy: tell browsers this is a normal page; keep a few safe defaults.
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    # The game loads nothing from anywhere else. It may only be framed by the Outiva console.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss://opensynd.outiva.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors https://outiva.com"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    # Every deploy changes the files, so make browsers check for a new copy; the big assets can be cached a while.
    <FilesMatch "\.(html|js|mjs|json|css)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <FilesMatch "\.(png|mp3|svg)$">
        Header set Cache-Control "public, max-age=86400"
    </FilesMatch>
</IfModule>
